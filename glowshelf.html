<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Glow Shelf</title>
<style>
:root{--bg:#fbf5f7;--card:#fff;--tx:#3b2f3a;--mu:#85767f;--ac:#d9799b;--ac2:#f6dce6;--bd:#efe0e7;--ok:#6fae8d;--wr:#e0a24a;--er:#d25c6c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d181c;--card:#2a2328;--tx:#f4eaef;--mu:#a9959f;--ac2:#3f2c36;--bd:#3a3035}}
:root[data-theme=dark]{--bg:#1d181c;--card:#2a2328;--tx:#f4eaef;--mu:#a9959f;--ac2:#3f2c36;--bd:#3a3035}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px Georgia,'Times New Roman',serif;padding-bottom:76px}
main{max-width:520px;margin:auto;padding:14px}h1{font-size:26px;margin:4px 0 10px;font-weight:600}h3{margin:16px 0 4px;font-size:16px}
.mu,small{color:var(--mu)}small{font-size:12px;font-family:system-ui,sans-serif}
button,input,select,textarea{font-family:system-ui,sans-serif}
.c{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px;margin:8px 0}.c.wr{border-color:var(--wr)}.c>b{font-size:22px;display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2 .c{margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.b,.sm,.ch{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:9px 14px;font-size:14px;cursor:pointer}
.pr{background:var(--ac);color:#fff;border-color:var(--ac)}.dn{color:var(--er)}.sm{padding:4px 10px;font-size:12px;border-radius:99px}
.ch{border-radius:99px;padding:6px 13px;margin:0 6px 8px 0}.ch.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:4px}
.ph{height:92px;border-radius:12px;display:grid;place-items:center;font-size:32px;overflow:hidden}.ph img,.ph2 img{width:100%;height:100%;object-fit:cover}
.ph2{height:100px;border:1px dashed var(--mu);border-radius:12px;display:grid;place-items:center;overflow:hidden;font-size:13px;color:var(--mu);margin:0}
.tag{background:var(--ac2);border-radius:99px;padding:2px 9px;font-size:12px;font-family:system-ui,sans-serif}.tag.er{background:var(--er);color:#fff}.tag.wr{background:var(--wr);color:#fff}.tag.ok{background:var(--ok);color:#fff}
.ck{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--bd);margin:0;color:var(--tx);font-size:15px}.ck input{width:22px;height:22px;accent-color:var(--ac);margin:0}.ck.dn span{opacity:.5;text-decoration:line-through}
.bar{position:relative;height:28px;background:var(--ac2);border-radius:9px;margin:6px 0;overflow:hidden}.bar i{position:absolute;inset:0 auto 0 0;background:var(--ac);opacity:.55}.bar span,.bar em{position:relative;padding:0 9px;line-height:28px;font-style:normal;font-size:12px;font-family:system-ui,sans-serif}.bar em{float:right}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;font-size:10px;padding:9px 0;background:none;color:var(--mu);cursor:pointer}nav button.on{color:var(--ac);font-weight:700}
#m{display:none;position:fixed;inset:0;background:#0007;z-index:9;align-items:flex-end}#m.on{display:flex}
.sh{background:var(--bg);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:22px 22px 0 0;padding:16px;margin:auto}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0;font-family:system-ui,sans-serif}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:14px;margin-top:3px}
input[type=color]{height:38px;padding:2px}.ck input,.lk input{width:22px}
.st{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--bd)}.st button{border:0;background:none;color:var(--tx);font-size:17px;cursor:pointer}
#t{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font:13px system-ui;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}.menu{display:block;width:100%;text-align:left;margin:6px 0;padding:14px}
</style></head><body><main id="v"></main>
<nav id="nv"></nav><div id="m"></div><div id="t"></div>
<script>
const K='glowshelf1',CATS=['Skincare','Makeup','Haircare','Fragrance','Tools'],E={Skincare:'🧴',Makeup:'💄',Haircare:'💇',Fragrance:'🌸',Tools:'🪮'};
let PH='';function toast(m){let t=$('#t');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2400)}window.alert=toast;
let S={p:[],r:[],l:[],pan:[],look:[]},tab='home',f='All',rt='AM',sub='',q='';
try{S=Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Storage full. Copy a backup, then remove some photos.')}};
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),td=()=>new Date().toISOString().slice(0,10),v=i=>$('#'+i).value;
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const P=id=>S.p.find(x=>x.id==id),money=n=>(S.cur||'€')+(+n||0).toFixed(2),val=()=>S.p.reduce((a,p)=>a+p.price*p.qty,0);
const exp=p=>{let d=[];if(p.expiry)d.push(new Date(p.expiry));if(p.opened&&p.pao){let o=new Date(p.opened);o.setMonth(o.getMonth()+ +p.pao);d.push(o)}return d.length?new Date(Math.min(...d)):null};
const left=p=>{let e=exp(p);return e?Math.ceil((e-new Date(td()))/864e5):null};
const uses=p=>S.l.filter(x=>x.pid==p.id).length,cpu=p=>uses(p)?p.price/uses(p):0;
const badge=p=>{let l=left(p);return l===null?'':l<0?'<span class="tag er">Expired</span>':`<span class="tag ${l<=30?'wr':'ok'}">${l<=60?l+'d':Math.round(l/30)+'mo'} left</span>`};
const img=(file,cb)=>{let r=new FileReader();r.onload=()=>{let i=new Image();i.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,420/Math.max(i.width,i.height));c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6))};i.src=r.result};r.readAsDataURL(file)};
if(!S.seeded){S.seeded=1;let a=uid(),b=uid(),c=uid();S.p=[{id:a,cat:'Skincare',brand:'Sample',name:'Gentle Cleanser',price:8,qty:2,opened:td(),pao:12,shade:'#d9799b'},{id:b,cat:'Skincare',brand:'Sample',name:'SPF 50',price:14,qty:1,opened:td(),pao:6,shade:'#e0a24a'},{id:c,cat:'Makeup',brand:'Sample',name:'Rose Lipstick',price:12,qty:1,expiry:'2027-06-01',shade:'#d25c6c'}];S.r=[{id:uid(),name:'Morning',type:'AM',steps:[{id:uid(),label:'Cleanser',pid:a},{id:uid(),label:'Sunscreen',pid:b}]},{id:uid(),name:'Night',type:'PM',steps:[{id:uid(),label:'Cleanser',pid:a}]}];save()}
function modal(t,h,ok,del,lbl){$('#m').innerHTML=`<div class=sh><h3>${t}</h3>${h}<div class=row style="margin-top:12px"><button class=b onclick=cl()>Close</button>${del?'<button class="b dn" id=md>Delete</button>':''}<button class="b pr" id=mo>${lbl||'Save'}</button></div></div>`;$('#m').className='on';$('#mo').onclick=()=>{if(ok()!==false)cl()};if(del)$('#md').onclick=function(){if(this.dataset.s){del();cl()}else{this.dataset.s=1;this.textContent='Tap again to confirm'}}}
const cl=()=>{$('#m').className='';save();render()};
function pForm(id){PH='';let p=id?P(id):{cat:'Skincare',qty:1,shade:'#d9799b'};const fl=(k,l,t='text')=>`<label>${l}<input id=f_${k} type=${t} value="${esc(p[k])}"></label>`;
modal(id?'Edit product':'Add product',`<label>Category<select id=f_cat>${CATS.map(x=>`<option ${x==p.cat?'selected':''}>${x}</option>`).join('')}</select></label>${fl('brand','Brand')}${fl('name','Product name')}<div class=g2>${fl('price','Unit price','number')}${fl('qty','Quantity','number')}</div>${fl('store','Store')}<div class=g2>${fl('bought','Purchase date','date')}${fl('opened','Opening date','date')}</div><div class=g2>${fl('expiry','Expiry date','date')}${fl('pao','PAO (months)','number')}</div>${fl('shade','Shade / swatch colour','color')}<label class="b" style="display:block;text-align:center;color:var(--tx);margin:10px 0">📷 <span id=phn>${p.ph?'Change photo':'Add photo'}</span><input id=f_ph type=file accept="image/*" hidden onchange="phv(this)"></label><img id=phi src="${p.ph||''}" style="width:100%;max-height:170px;object-fit:cover;border-radius:12px;${p.ph?'':'display:none'}">${fl('notes','Notes')}`,()=>{let o={id:p.id||uid(),ph:PH||p.ph,fin:p.fin||0};['cat','brand','name','price','qty','store','bought','opened','expiry','pao','shade','notes'].forEach(k=>o[k]=v('f_'+k));if(!o.name){alert('Enter a product name');return false}id?Object.assign(P(id),o):S.p.push(o)},id&&(()=>{S.p=S.p.filter(x=>x.id!=id)}))}
const phv=i=>{let f=i.files[0];if(!f)return;$('#phn').textContent='Loading...';img(f,d=>{PH=d;$('#phn').textContent='Photo ready';let e=$('#phi');e.src=d;e.style.display='block'})};
const fin=id=>{let p=P(id);p.fin=(+p.fin||0)+1;if(p.qty>1)p.qty--;else p.done=1;save();render()};
const lst=()=>{let a=S.p.filter(p=>!p.done&&(f=='All'||p.cat==f)&&(p.name+(p.brand||'')).toLowerCase().includes(q.toLowerCase()));
return a.length?`<div class=pg>${a.map(p=>`<div class=pc onclick="pForm('${p.id}')"><div class=ph style="background:${p.shade||'#f6dce6'}33">${p.ph?`<img src="${p.ph}">`:E[p.cat]}</div><b>${esc(p.name)}</b><small>${esc(p.brand)}</small><div class=row><span class=tag>×${p.qty}</span>${badge(p)}</div><small>${money(p.price*p.qty)}${uses(p)?' · '+money(cpu(p))+'/use':''}</small><button class=sm onclick="event.stopPropagation();fin('${p.id}')">Used up</button></div>`).join('')}</div>`:'<p class=mu>Nothing here yet. Tap Add to start your shelf.</p>'};
const rc=r=>`<div class=c><div class=row><b style="font-size:16px">${esc(r.name)}</b><button class=sm onclick="rEdit('${r.id}')">Edit steps</button></div>`+(r.steps.map(s=>{let d=S.l.some(x=>x.d==td()&&x.sid==s.id);return `<label class="ck ${d?'dn':''}"><input type=checkbox ${d?'checked':''} onchange="tg('${r.id}','${s.id}')"><span>${esc(s.label)}${s.pid&&P(s.pid)?' <small>'+esc(P(s.pid).name)+'</small>':''}</span></label>`}).join('')||'<small>No steps yet. Tap Edit steps.</small>')+'</div>';
const tg=(rid,sid)=>{let i=S.l.findIndex(x=>x.d==td()&&x.sid==sid);if(i>=0)S.l.splice(i,1);else{let s=S.r.find(r=>r.id==rid).steps.find(s=>s.id==sid);S.l.push({d:td(),sid,pid:s.pid,rid})}save();render()};
function rEdit(id){let r=S.r.find(x=>x.id==id);const po='<option value="">No product</option>'+S.p.map(x=>`<option value=${x.id}>${esc((x.brand||'')+' '+x.name)}</option>`).join('');
modal('Edit routine',`<label>Name<input value="${esc(r.name)}" oninput="S.r.find(x=>x.id=='${id}').name=this.value"></label>`+r.steps.map((s,i)=>`<div class=st><span>${i+1}. ${esc(s.label)}${s.pid&&P(s.pid)?' <small>'+esc(P(s.pid).name)+'</small>':''}</span><span><button onclick="mv('${id}',${i},-1)">↑</button><button onclick="mv('${id}',${i},1)">↓</button><button onclick="dl('${id}',${i})">✕</button></span></div>`).join('')+`<div class=g2 style="margin-top:10px"><input id=ns placeholder="Step, e.g. Toner"><select id=np>${po}</select></div><button class=b style="margin-top:8px" onclick="ad('${id}')">Add step</button>`,()=>{},()=>{S.r=S.r.filter(x=>x.id!=id)})}
const mv=(id,i,d)=>{let s=S.r.find(x=>x.id==id).steps,j=i+d;if(j<0||j>=s.length)return;[s[i],s[j]]=[s[j],s[i]];save();rEdit(id)},dl=(id,i)=>{S.r.find(x=>x.id==id).steps.splice(i,1);save();rEdit(id)},ad=id=>{let l=v('ns').trim();if(!l)return;S.r.find(x=>x.id==id).steps.push({id:uid(),label:l,pid:v('np')});save();rEdit(id)};
const nr=()=>modal('New '+rt+' routine',`<label>Name<input id=rn value="${rt} routine"></label>`,()=>{let n=v('rn').trim();if(!n)return false;let r={id:uid(),name:n,type:rt,steps:[]};S.r.push(r);save();rEdit(r.id);return false},null,'Create');
const curF=()=>modal('Currency',`<label>Symbol<input id=cu value="${esc(S.cur||'€')}"></label>`,()=>{S.cur=v('cu')||'€'});
const clr=()=>modal('Clear all data','<p>This deletes every product, routine, photo and log. Copy a backup first if unsure.</p>',()=>{S={p:[],r:[],l:[],pan:[],look:[],seeded:1}},null,'Delete everything');
function panF(){modal('New Project Pan',`<label>Product<select id=pp1>${S.p.filter(p=>!p.done).map(p=>`<option value=${p.id}>${esc(p.name)}</option>`).join('')}</select></label><label>Goal: number of uses<input id=pp2 type=number value=30></label>`,()=>{if(!v('pp1'))return false;S.pan.push({id:uid(),pid:v('pp1'),target:+v('pp2')||30,start:td()})})}
const pp=(id,k,file)=>file&&img(file,d=>{S.pan.find(x=>x.id==id)[k]=d;save();render()});
function lookF(){modal('New look',`<label>Look name<input id=lk1></label><label>Photo<input id=lk2 type=file accept="image/*"></label><label>Products used</label>${S.p.map(p=>`<label class="ck lk"><input type=checkbox class=lp value=${p.id}><span>${esc(p.name)}</span></label>`).join('')}`,()=>{let o={id:uid(),name:v('lk1')||'Look',pids:[...document.querySelectorAll('.lp:checked')].map(x=>x.value)},fl=$('#lk2').files[0];const put=()=>{S.look.push(o);save();render()};fl?img(fl,d=>{o.ph=d;put()}):put()})}
const im=()=>{try{S=Object.assign({p:[],r:[],l:[],pan:[],look:[]},JSON.parse(v('bt')));save();alert('Imported');render()}catch(e){alert('That text is not valid backup data.')}};
const V={
home:()=>{let ex=S.p.filter(p=>!p.done&&left(p)!==null&&left(p)<=30).length,tot=S.r.filter(r=>r.type=='AM'||r.type=='PM').reduce((a,r)=>a+r.steps.length,0),dn=S.l.filter(x=>x.d==td()&&S.r.some(r=>r.id==x.rid&&(r.type=='AM'||r.type=='PM'))).length;
return `<h1>Glow Shelf</h1><small>${new Date().toDateString()}</small><div class=g2 style="margin-top:10px"><div class=c><b>${S.p.filter(p=>!p.done).reduce((a,p)=>a+ +p.qty,0)}</b><small>Items on shelf</small></div><div class=c><b>${money(val())}</b><small>Shelf value</small></div><div class=c><b>${dn}/${tot}</b><small>Steps done today</small></div><div class="c ${ex?'wr':''}"><b>${ex}</b><small>Expiring in 30 days</small></div></div><h3>Today</h3>`+(S.r.filter(r=>r.type=='AM'||r.type=='PM').map(rc).join('')||'<p class=mu>Create a routine in the Routine tab.</p>')},
shelf:()=>`<div class=row><h1>My Shelf</h1><button class="b pr" onclick="pForm()">Add</button></div><input placeholder="Search products" value="${esc(q)}" oninput="q=this.value;$('#ls').innerHTML=lst()" style="margin-bottom:8px"><div>${['All',...CATS].map(c=>`<button class="ch ${f==c?'on':''}" onclick="f='${c}';render()">${c}</button>`).join('')}</div><div id=ls>${lst()}</div>`,
routine:()=>`<div class=row><h1>Routines</h1><button class="b pr" onclick="nr()">New</button></div><div>${['AM','PM','Weekly','Makeup'].map(t=>`<button class="ch ${rt==t?'on':''}" onclick="rt='${t}';render()">${t}</button>`).join('')}</div>`+(S.r.filter(r=>r.type==rt).map(rc).join('')||'<p class=mu>No routine here. Tap New.</p>'),
expiry:()=>{let a=S.p.filter(p=>!p.done&&left(p)!==null).sort((x,y)=>left(x)-left(y));return '<h1>Expiry</h1>'+(a.map(p=>`<div class=c onclick="pForm('${p.id}')"><div class=row><b style="font-size:16px">${esc(p.name)}</b>${badge(p)}</div><small>${esc(p.brand)} · ends ${exp(p).toDateString()}${p.opened&&p.pao?' · PAO '+p.pao+'M':''}</small></div>`).join('')||'<p class=mu>Add an expiry date, or an opening date plus PAO, to a product.</p>')},
stats:()=>{let by={};S.p.forEach(p=>by[p.cat]=(by[p.cat]||0)+p.price*p.qty);let mx=Math.max(1,...Object.values(by)),used=S.p.reduce((a,p)=>a+(+p.fin||0),0),exd=S.p.filter(p=>!p.done&&left(p)<0).length,top=S.p.filter(cpu).sort((a,b)=>cpu(a)-cpu(b)),pl=CATS.map(c=>{let a=S.p.filter(p=>p.cat==c&&!p.done);return a.length?`<div class=c><div class=row><b style="font-size:16px">${E[c]} ${c}</b><small>${a.length} products · ${a.reduce((s,p)=>s+ +p.qty,0)} units · ${money(a.reduce((s,p)=>s+p.price*p.qty,0))}</small></div>${a.map(p=>`<div class=row style="padding:5px 0;border-top:1px solid var(--bd)"><span>${esc(p.name)} <small>×${p.qty}</small></span><small>${money(p.price*p.qty)} · ${uses(p)} uses</small></div>`).join('')}</div>`:''}).join('');
return `<h1>Statistics</h1><div class=g2><div class=c><b>${money(val())}</b><small>Inventory value</small></div><div class=c><b>${S.l.length}</b><small>Total uses logged</small></div><div class=c><b>${used}</b><small>Fully used up</small></div><div class=c><b>${exd}</b><small>Expired (waste)</small></div></div><h3>Spend by category</h3><div class=c>${Object.entries(by).map(([k,x])=>`<div class=bar><i style="width:${x/mx*100}%"></i><span>${k}</span><em>${money(x)}</em></div>`).join('')||'<small>No data</small>'}</div><h3>Products by category</h3>${pl||'<small>No products yet</small>'}<h3>Cost per use</h3><div class=c>${top.map(p=>`<div class=row style="padding:4px 0"><span>${esc(p.name)}</span><b>${money(cpu(p))}</b></div>`).join('')||'<small>Tick routine steps to build cost-per-use data.</small>'}</div>`},
more:()=>{const bk=`<button class=b onclick="sub=''">Back</button>`;
if(sub=='pan')return `<div class=row><h1>Project Pan</h1><button class="b pr" onclick="panF()">New</button></div>`+(S.pan.map(n=>{let p=P(n.pid);if(!p)return'';let u=S.l.filter(x=>x.pid==n.pid&&x.d>=n.start).length;return `<div class=c><div class=row><b style="font-size:16px">${esc(p.name)}</b><button class=sm onclick="S.pan=S.pan.filter(x=>x.id!='${n.id}');save();render()">Remove</button></div><div class=bar><i style="width:${Math.min(100,u/n.target*100)}%"></i><em>${u}/${n.target} uses</em></div><div class=g2>${['b','a'].map(k=>`<label class=ph2>${n[k]?`<img src="${n[k]}">`:(k=='b'?'Before photo':'After photo')}<input type=file accept="image/*" hidden onchange="pp('${n.id}','${k}',this.files[0])"></label>`).join('')}</div></div>`}).join('')||'<p class=mu>Pick products you want to finish.</p>')+bk;
if(sub=='look')return `<div class=row><h1>Lookbook</h1><button class="b pr" onclick="lookF()">New</button></div><div class=pg>${S.look.map(l=>`<div class=pc><div class=ph>${l.ph?`<img src="${l.ph}">`:'💄'}</div><b>${esc(l.name)}</b><small>${l.pids.map(i=>P(i)?.name).filter(Boolean).join(', ')||'No products tagged'}</small><button class=sm onclick="S.look=S.look.filter(x=>x.id!='${l.id}');save();render()">Remove</button></div>`).join('')}</div>`+(S.look.length?'':'<p class=mu>Save a makeup look and tag the products you used.</p>')+bk;
if(sub=='bk')return `<h1>Backup</h1><small>Copy this text into Notes or a chat with yourself. To restore, paste it back here and tap Import.</small><textarea id=bt rows=8></textarea><div class=row style="margin-top:8px"><button class=b onclick="navigator.clipboard&&navigator.clipboard.writeText(v('bt'))">Copy</button><button class="b pr" onclick="im()">Import</button></div>`+bk;
return `<h1>More</h1><button class="b menu" onclick="sub='pan';render()">Project Pan</button><button class="b menu" onclick="sub='look';render()">Lookbook</button><button class="b menu" onclick="sub='bk';render()">Backup and restore</button><button class="b menu" onclick="curF()">Currency: ${S.cur||'€'}</button><button class="b menu dn" onclick="clr()">Clear all data</button>`}};
const T=[['home','Home'],['shelf','Shelf'],['routine','Routine'],['expiry','Expiry'],['stats','Stats'],['more','More']];
