<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Glow Shelf</title>
<style>
:root{--bg:#fbf5f7;--card:#fff;--tx:#3b2f3a;--mu:#85767f;--ac:#d9799b;--ac2:#f6dce6;--bd:#efe0e7;--ok:#6fae8d;--wr:#e0a24a;--er:#d25c6c;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d181c;--card:#2a2328;--tx:#f4eaef;--mu:#a9959f;--ac2:#3f2c36;--bd:#3a3035}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,sans-serif;padding-bottom:76px}
main{max-width:520px;margin:auto;padding:14px}
h1{font-size:26px;margin:4px 0 10px;font-weight:600}
h3{margin:16px 0 4px;font-size:16px}
.mu,small{color:var(--mu)}
small{font-size:12px}
button,input,select,textarea{font-family:inherit}
.c{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px;margin:8px 0}
.c>b{font-size:22px;display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g2 .c{margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.b,.sm,.ch{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:9px 14px;font-size:14px;cursor:pointer}
.pr{background:var(--ac);color:#fff;border-color:var(--ac)}
.sm{padding:4px 10px;font-size:12px;border-radius:99px}
.ch{border-radius:99px;padding:6px 13px;margin:0 6px 8px 0}
.ch.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:4px}
.ph{height:110px;border-radius:12px;display:grid;place-items:center;font-size:32px;overflow:hidden;background:var(--ac2)}
.ck{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--bd);margin:0;font-size:15px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);z-index:10}
nav button{flex:1;border:0;font-size:11px;padding:12px 0;background:none;color:var(--mu);cursor:pointer}
nav button.on{color:var(--ac);font-weight:700}
#t{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
</style>
</head>
<body>
<main id="v"></main>
<nav id="nv"></nav>
<div id="t"></div>

<script>
var K='glowshelf1', E={Skincare:'🧴',Makeup:'💄',Haircare:'💇',Fragrance:'🌸',Tools:'🪮'};
var S={p:[],r:[],l:[],h:[]}, tab='home';

try {
    var raw = localStorage.getItem(K);
    if(raw) S = Object.assign(S, JSON.parse(raw));
} catch(e){}

S.p = S.p || [];
S.r = S.r || [];

function save(){ try{ localStorage.setItem(K, JSON.stringify(S)); }catch(e){} }
function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function money(n){ return (S.cur||'€') + (+n||0).toFixed(2); }
function val(){ return S.p.reduce(function(a,p){ return a + ((p.price||0)*(p.qty||1)); },0); }

if(!S.seeded){
    S.seeded = 1;
    var a=uid(), b=uid();
    S.p = [
        {id:a, cat:'Skincare', brand:'Glow', name:'Gentle Cleanser', price:12, qty:1},
        {id:b, cat:'Skincare', brand:'Glow', name:'Daily SPF 50', price:18, qty:1}
    ];
    S.r = [
        {id:uid(), name:'Morning Routine', steps:[{id:uid(), label:'Cleanse'}, {id:uid(), label:'Sunscreen'}]}
    ];
    save();
}

function render(){
    var v = document.getElementById('v');
    var nv = document.getElementById('nv');
    if(!v || !nv) return;

    try {
        if(tab === 'home'){
            var activeItems = S.p.filter(function(p){ return !p.done; });
            var itemsCount = activeItems.reduce(function(a,p){ return a + (+p.qty||1); }, 0);
            
            var html = '<h1>Glow Shelf</h1><small>' + new Date().toDateString() + '</small>' +
            '<div class="g2" style="margin-top:10px">' +
                '<div class="c"><b>' + itemsCount + '</b><small>Items on Shelf</small></div>' +
                '<div class="c"><b>' + money(val()) + '</b><small>Shelf Value</small></div>' +
            '</div>' +
            '<h3>Routines</h3>';

            if(S.r.length === 0){
                html += '<p class="mu">No routines added yet.</p>';
            } else {
                S.r.forEach(function(r){
                    html += '<div class="c"><b>' + esc(r.name) + '</b>';
                    r.steps.forEach(function(st){
                        html += '<div class="ck"><span>' + esc(st.label) + '</span></div>';
                    });
                    html += '</div>';
                });
            }
            v.innerHTML = html;
        } 
        else if(tab === 'shelf'){
            var listHtml = '<div class="row"><h1>My Shelf</h1></div><div class="pg">';
            if(S.p.length === 0){
                listHtml += '<p class="mu">Shelf is empty.</p>';
            } else {
                S.p.forEach(function(p){
                    listHtml += '<div class="pc">' +
                        '<div class="ph">' + (E[p.cat]||'🧴') + '</div>' +
                        '<b>' + esc(p.name) + '</b>' +
                        '<small>' + esc(p.brand) + '</small>' +
                        '<b>' + money(p.price) + '</b>' +
                    '</div>';
                });
            }
            listHtml += '</div>';
            v.innerHTML = listHtml;
        } 
        else if(tab === 'stats'){
            v.innerHTML = '<h1>Statistics</h1>' +
            '<div class="c"><b>' + money(val()) + '</b><small>Total Shelf Value</small></div>' +
            '<div class="c"><b>' + S.p.length + '</b><small>Total Products Registered</small></div>';
        }

        nv.innerHTML = [
            ['home','Home'],
            ['shelf','Shelf'],
            ['stats','Stats']
        ].map(function(item){
            return '<button class="' + (tab===item[0]?'on':'') + '" onclick="tab=\'' + item[0] + '\';render()">' + item[1] + '</button>';
        }).join('');

    } catch(err) {
        v.innerHTML = '<div style="padding:20px;color:red;"><h3>Rendering Issue</h3><p>' + err.message + '</p></div>';
    }
}

function init(){ render(); }

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
document.addEventListener('deviceready', init, false);
</script>
</body>
  </html>
