<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Glow Shelf</title>
<style>
:root{--bg:#fbf5f7;--card:#fff;--tx:#3b2f3a;--mu:#85767f;--ac:#d9799b;--ac2:#f6dce6;--bd:#efe0e7;--ok:#6fae8d;--wr:#e0a24a;--er:#d25c6c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d181c;--card:#2a2328;--tx:#f4eaef;--mu:#a9959f;--ac2:#3f2c36;--bd:#3a3035}}
:root[data-theme=dark]{--bg:#1d181c;--card:#2a2328;--tx:#f4eaef;--mu:#a9959f;--ac2:#3f2c36;--bd:#3a3035}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px Georgia,'Times New Roman',serif;padding-bottom:76px}
main{max-width:520px;margin:auto;padding:14px}h1{font-size:26px;margin:4px 0 10px;font-weight:600}h3{margin:16px 0 4px;font-size:16px}
.mu,small{color:var(--mu)}small{font-size:12px;font-family:system-ui,sans-serif}
button,input,select,textarea{font-family:system-ui,sans-serif}
.c{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px;margin:8px 0}.c.wr{border-color:var(--wr)}.c>b{font-size:22px;display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2 .c{margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.b,.sm,.ch{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:9px 14px;font-size:14px;cursor:pointer}
.pr{background:var(--ac);color:#fff;border-color:var(--ac)}.dn{color:var(--er)}.sm{padding:4px 10px;font-size:12px;border-radius:99px}
.ch{border-radius:99px;padding:6px 13px;margin:0 6px 8px 0}.ch.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:4px}
.ph{height:130px;border-radius:12px;display:grid;place-items:center;font-size:32px;overflow:hidden}.ph img,.ph2 img{width:100%;height:100%;object-fit:contain}
.ph2{height:100px;border:1px dashed var(--mu);border-radius:12px;display:grid;place-items:center;overflow:hidden;font-size:13px;color:var(--mu);margin:0}
.tag{background:var(--ac2);border-radius:99px;padding:2px 9px;font-size:12px;font-family:system-ui,sans-serif}.tag.er{background:var(--er);color:#fff}.tag.wr{background:var(--wr);color:#fff}.tag.ok{background:var(--ok);color:#fff}
.ck{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--bd);margin:0;color:var(--tx);font-size:15px}.ck input{width:22px;height:22px;accent-color:var(--ac);margin:0}.ck.dn span{opacity:.5;text-decoration:line-through}
.bar{position:relative;height:28px;background:var(--ac2);border-radius:9px;margin:6px 0;overflow:hidden}.bar i{position:absolute;top:0;bottom:0;left:0;background:var(--ac);opacity:.55}.bar span,.bar em{position:relative;padding:0 9px;line-height:28px;font-style:normal;font-size:12px;font-family:system-ui,sans-serif}.bar em{float:right}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;font-size:10px;padding:9px 0;background:none;color:var(--mu);cursor:pointer}nav button.on{color:var(--ac);font-weight:700}
#m{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:#0007;z-index:9;align-items:flex-end}#m.on{display:flex}
.sh{background:var(--bg);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:22px 22px 0 0;padding:16px;margin:auto}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0;font-family:system-ui,sans-serif}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:14px;margin-top:3px}
input[type=color]{height:38px;padding:2px}.ck input,.lk input{width:22px}
.st{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--bd)}.st button{border:0;background:none;color:var(--tx);font-size:17px;cursor:pointer}
#t{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:99px;border-radius:99px;font:13px system-ui;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;display:flex;gap:12px;align-items:center;white-space:nowrap}#t button{background:none;border:0;color:var(--ac2);font-weight:700;font-size:13px;cursor:pointer}#ask{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:#0007;z-index:30;align-items:flex-end}#ask.on{display:flex}.menu{display:block;width:100%;text-align:left;margin:6px 0;padding:14px}
</style><script>
window.addEventListener('error',function(e){var v=document.getElementById('v');if(v)v.innerHTML='<p style="padding:16px;color:#e66;font:14px sans-serif">ERROR: '+e.message+'<br>line '+e.lineno+' col '+e.colno+'<br>'+navigator.userAgent+'</p>'});
