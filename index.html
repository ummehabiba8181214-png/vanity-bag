<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Glow Shelf</title>
<style>

</style><script>
window.addEventListener('error',function(e){var v=document.getElementById('v');if(v)v.innerHTML='<p style="padding:16px;color:#e66;font:14px sans-serif">ERROR: '+e.message+'<br>line '+e.lineno+' col '+e.colno+'<br>'+navigator.userAgent+'</p>'});
setTimeout(function(){var v=document.getElementById('v');if(v&&v.textContent.indexOf('Loading')===0)v.innerHTML='<p style="padding:16px;color:#e66;font:14px sans-serif">Script did not start (no error reported).<br>'+navigator.userAgent+'</p>'},2000);
</script></head><body><main id="v">Loading…</main>
<nav id="nv"></nav><div id="m"></div><div id="t"></div><div id="ask"></div>
<script>
window.onerror=function(m,u,l){var v=document.getElementById('v');if(v)v.innerHTML='<p style="padding:16px;color:#c33">App error: '+m+' (line '+l+')</p>'};

const K='glowshelf1',CATS=['Skincare','Makeup','Haircare','Fragrance','Tools'],E={Skincare:'🧴',Makeup:'💄',Haircare:'💇',Fragrance:'🌸',Tools:'🪮'};
let PH='',tt,hp=0,mp=0,ign=0;function toast(m,u){let t=$('#t');t.innerHTML='<span>'+m+'</span>'+(u?'<button id=tu>Undo</button>':'');t.style.opacity=1;t.style.pointerEvents=u?'auto':'none';clearTimeout(tt);tt=setTimeout(()=>{t.style.opacity=0;t.style.pointerEvents='none'},u?7000:2400);if(u)$('#tu').onclick=()=>{u();t.style.opacity=0;t.style.pointerEvents='none'}}window.alert=m=>toast(m);
let S={p:[],r:[],l:[],pan:[],look:[],h:[]},tab='home',f='All',rt='AM',sub='',q='';
try{S=Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
S.h=S.h||[];S.p.forEach(p=>{if(p.done&&p.qty>0)p.qty=0});try{history.replaceState({tab:'home',sub:''},'')}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Storage full. Copy a backup, then remove some photos.')}};
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),td=()=>new Date().toISOString().slice(0,10),v=i=>$('#'+i).value;
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const P=id=>S.p.find(x=>x.id==id),money=n=>(S.cur||'€')+(+n||0).toFixed(2),val=()=>S.p.reduce((a,p)=>a+p.price*p.qty,0);
const exp=p=>{let d=[];if(p.expiry)d.push(new Date(p.expiry));if(p.opened&&p.pao){let o=new Date(p.opened);o.setMonth(o.getMonth()+ +p.pao);d.push(o)}return d.length?new Date(Math.min(...d)):null};
const left=p=>{let e=exp(p);return e?Math.ceil((e-new Date(td()))/864e5):null};
const uses=p=>S.l.filter(x=>x.pid==p.id).length,cpu=p=>uses(p)?p.price/uses(p):0;
const badge=p=>{let l=left(p);return l===null?'':l<0?'<span class="tag er">Expired</span>':`<span class="tag ${l<=30?'wr':'ok'}">${l<=60?l+'d':Math.round(l/30)+'mo'} left</span>`};
const img=(file,cb)=>{let r=new FileReader();r.onload=()=>{let i=new Image();i.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,900/Math.max(i.width,i.height));c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};i.onerror=()=>alert('Could not read this photo. Try another one.');i.src=r.result};r.readAsDataURL(file)};
if(!S.seeded){S.seeded=1;let a=uid(),b=uid(),c=uid();S.p=[{id:a,cat:'Skincare',brand:'Sample',name:'Gentle Cleanser',price:8,qty:2,opened:td(),pao:12,shade:'#d9799b'},{id:b,cat:'Skincare',brand:'Sample',name:'SPF 50',price:14,qty:1,opened:td(),pao:6,shade:'#e0a24a'},{id:c,cat:'Makeup',brand:'Sample',name:'Rose Lipstick',price:12,qty:1,expiry:'2027-06-01',shade:'#d25c6c'}];S.r=[{id:uid(),name:'Morning',type:'AM',steps:[{id:uid(),label:'Cleanser',pid:a},{id:uid(),label:'Sunscreen',pid:b}]},{id:uid(),name:'Night',type:'PM',steps:[{id:uid(),label:'Cleanser',pid:a}]}];save()}
function modal(t,h,ok,del,lbl){if($('#m').className!='on'){try{history.pushState({tab,sub,m:1},'');mp=1}catch(e){}}$('#m').innerHTML=`<div class=sh><h3>${t}</h3>${h}<div class=row style="margin-top:12px"><button class=b onclick=cl()>Close</button>${del?'<button class="b dn" id=md>Delete</button>':''}<button class="b pr" id=mo>${lbl||'Save'}</button></div></div>`;$('#m').className='on';$('#mo').onclick=()=>{if(ok()!==false)cl()};if(del)$('#md').onclick=()=>ask('Delete this permanently?',()=>{del();cl()})}
function ask(msg,fn){$('#ask').innerHTML=`<div class=sh><p>${msg}</p><div class=row><button class=b id=an>Cancel</button><button class="b dn" id=ay>Yes, delete</button></div></div>`;$('#ask').className='on';$('#an').onclick=()=>$('#ask').className='';$('#ay').onclick=()=>{$('#ask').className='';fn()}}
const cl=()=>{$('#m').className='';if(mp){mp=0;ign=1;history.back()}save();render()};
function pForm(id){PH='';let p=id?P(id):{cat:'Skincare',qty:1,shade:'#d9799b'};const fl=(k,l,t='text')=>`<label>${l}<input id=f_${k} type=${t} value="${esc(p[k])}"></label>`;
modal(id?'Edit product':'Add product',`<label>Category<select id=f_cat>${CATS.map(x=>`<option ${x==p.cat?'selected':''}>${x}</option>`).join('')}</select></label>${fl('brand','Brand')}${fl('name','Product name')}<div class=g2>${fl('price','Unit price','number')}${fl('qty','Quantity','number')}</div>${fl('store','Store')}<div class=g2>${fl('bought','Purchase date','date')}${fl('opened','Opening date','date')}</div><div class=g2>${fl('expiry','Expiry date','date')}${fl('pao','PAO (months)','number')}</div>${fl('shade','Shade / swatch colour','color')}<div class=g2><label class=b style="text-align:center;color:var(--tx);margin:10px 0 0">📷 Camera<input type=file accept="image/*" capture=environment hidden onchange="phv(this)"></label><label class=b style="text-align:center;color:var(--tx);margin:10px 0 0">🖼 Gallery<input id=f_ph type=file accept="image/*" hidden onchange="phv(this)"></label></div><small id=phn style="display:block;margin:6px 0">${p.ph?'Photo saved. Pick again to change it.':'No photo yet'}</small><img id=phi src="${p.ph||''}" style="width:100%;object-fit:contain;border-radius:12px;${p.ph?'':'display:none'}">${fl('notes','Notes')}`,()=>{let o={id:p.id||uid(),ph:PH||p.ph,fin:p.fin||0};['cat','brand','name','price','qty','store','bought','opened','expiry','pao','shade','notes'].forEach(k=>o[k]=v('f_'+k));if(!o.name){alert('Enter a product name');return false}id?Object.assign(P(id),o):S.p.push(o)},id&&(()=>{S.p=S.p.filter(x=>x.id!=id)}))}
const phv=i=>{let f=i.files[0];if(!f)return;$('#phn').textContent='Loading...';img(f,d=>{PH=d;$('#phn').textContent='Photo ready';let e=$('#phi');e.src=d;e.style.display='block'})};
const fin=id=>{let p=P(id);if(!p||p.qty<1)return;let e={id:uid(),pid:id,d:td()};p.qty=+p.qty-1;p.fin=(+p.fin||0)+1;p.done=p.qty<1?1:0;S.h.push(e);save();render();toast(esc(p.name)+' used up',()=>undoUse(e.id))};
const undoUse=eid=>{let e=S.h.find(x=>x.id==eid);if(!e)return;let p=P(e.pid);if(p){p.qty=(+p.qty||0)+1;p.fin=Math.max(0,(+p.fin||1)-1);p.done=0}S.h=S.h.filter(x=>x.id!=eid);save();render()};
const restore=id=>{let p=P(id);p.qty=1;p.fin=Math.max(0,(+p.fin||1)-1);p.done=0;let i=S.h.map(x=>x.pid).lastIndexOf(id);if(i>=0)S.h.splice(i,1);save();render();toast('Restored to shelf')};
const usedList=()=>{let d=S.p.filter(p=>p.done);return d.length?d.map(p=>`<div class=c><div class=row><b style="font-size:16px">${esc(p.name)}</b><span class=tag>used ${p.fin||1}x</span></div><small>${esc(p.brand)} · ${money(p.price)} each</small><div class=row style="margin-top:8px"><button class=sm onclick="restore('${p.id}')">Restore to shelf</button><button class="sm dn" onclick="ask('Delete permanently?',()=>{S.p=S.p.filter(x=>x.id!='${p.id}');save();render()})">Delete</button></div></div>`).join(''):'<p class=mu>No fully used-up products yet.</p>'};
const lst=()=>{if(f=='Used up')return usedList();let a=S.p.filter(p=>!p.done&&(f=='All'||p.cat==f)&&(p.name+(p.brand||'')).toLowerCase().includes(q.toLowerCase()));
return a.length?`<div class=pg>${a.map(p=>`<div class=pc onclick="pForm('${p.id}')"><div class=ph style="background:${p.shade||'#f6dce6'}33">${p.ph?`<img src="${p.ph}">`:E[p.cat]}</div><b>${esc(p.name)}</b><small>${esc(p.brand)}</small><div class=row><span class=tag>×${p.qty}</span>${badge(p)}</div><small>${money(p.price*p.qty)}${uses(p)?' · '+money(cpu(p))+'/use':''}</small><button class=sm onclick="event.stopPropagation();fin('${p.id}')">Used up</button></div>`).join('')}</div>`:'<p class=mu>Nothing here yet. Tap Add to start your shelf.</p>'};
const rc=r=>`<div class=c><div class=row><b style="font-size:16px">${esc(r.name)}</b><button class=sm onclick="rEdit('${r.id}')">Edit steps</button></div>`+(r.steps.map(s=>{let d=S.l.some(x=>x.d==td()&&x.sid==s.id);return `<label class="ck ${d?'dn':''}"><input type=checkbox ${d?'checked':''} onchange="tg('${r.id}','${s.id}')"><span>${esc(s.label)}${s.pid&&P(s.pid)?' <small>'+esc(P(s.pid).name)+'</small>':''}</span></label>`}).join('')||'<small>No steps yet. Tap Edit steps.</small>')+'</div>';
const tg=(rid,sid)=>{let i=S.l.findIndex(x=>x.d==td()&&x.sid==sid);if(i>=0)S.l.splice(i,1);else{let s=S.r.find(r=>r.id==rid).steps.find(s=>s.id==sid);S.l.push({d:td(),sid,pid:s.pid,rid})}save();render()};
function rEdit(id){let r=S.r.find(x=>x.id==id);const po='<option value="">No product</option>'+S.p.map(x=>`<option value=${x.id}>${esc((x.brand||'')+' '+x.name)}</option>`).join('');
modal('Edit routine',`<label>Name<input value="${esc(r.name)}" oninput="S.r.find(x=>x.id=='${id}').name=this.value"></label>`+r.steps.map((s,i)=>`<div class=st><span>${i+1}. ${esc(s.label)}${s.pid&&P(s.pid)?' <small>'+esc(P(s.pid).name)+'</small>':''}</span><span><button onclick="mv('${id}',${i},-1)">↑</button><button onclick="mv('${id}',${i},1)">↓</button><button onclick="dl('${id}',${i})">✕</button></span></div>`).join('')+`<div class=g2 style="margin-top:10px"><input id=ns placeholder="Step, e.g. Toner"><select id=np>${po}</select></div><button class=b style="margin-top:8px" onclick="ad('${id}')">Add step</button>`,()=>{},()=>{S.r=S.r.filter(x=>x.id!=id)})}
const mv=(id,i,d)=>{let s=S.r.find(x=>x.id==id).steps,j=i+d;if(j<0||j>=s.length)return;[s[i],s[j]]=[s[j],s[i]];save();rEdit(id)},dl=(id,i)=>{S.r.find(x=>x.id==id).steps.splice(i,1);save();rEdit(id)},ad=id=>{let l=v('ns').trim();if(!l)return;S.r.find(x=>x.id==id).steps.push({id:uid(),label:l,pid:v('np')});save();rEdit(id)};
const nr=()=>modal('New '+rt+' routine',`<label>Name<input id=rn value="${rt} routine"></label>`,()=>{let n=v('rn').trim();if(!n)return false;let r={id:uid(),name:n,type:rt,steps:[]};S.r.push(r);save();rEdit(r.id);return false},null,'Create');
const curF=()=>modal('Currency',`<label>Symbol<input id=cu value="${esc(S.cur||'€')}"></label>`,()=>{S.cur=v('cu')||'€'});
const clr=()=>modal('Clear all data','<p>This deletes every product, routine, photo and log. Copy a backup first if unsure.</p>',()=>{S={p:[],r:[],l:[],pan:[],look:[],h:[],seeded:1}},null,'Delete everything');
function panF(){modal('New Project Pan',`<label>Product<select id=pp1>${S.p.filter(p=>!p.done).map(p=>`<option value=${p.id}>${esc(p.name)}</option>`).join('')}</select></label><label>Goal: number of uses<input id=pp2 type=number value=30></label>`,()=>{if(!v('pp1'))return false;S.pan.push({id:uid(),pid:v('pp1'),target:+v('pp2')||30,start:td()})})}
const pp=(id,k,file)=>file&&img(file,d=>{S.pan.find(x=>x.id==id)[k]=d;save();render()});
function lookF(){modal('New look',`<label>Look name<input id=lk1></label><label>Photo<input id=lk2 type=file accept="image/*"></label><label>Products used</label>${S.p.map(p=>`<label class="ck lk"><input type=checkbox class=lp value=${p.id}><span>${esc(p.name)}</span></label>`).join('')}`,()=>{let o={id:uid(),name:v('lk1')||'Look',pids:[...document.querySelectorAll('.lp:checked')].map(x=>x.value)},fl=$('#lk2').files[0];const put=()=>{S.look.push(o);save();render()};fl?img(fl,d=>{o.ph=d;put()}):put()})}
const im=()=>{try{S=Object.assign({p:[],r:[],l:[],pan:[],look:[],h:[]},JSON.parse(v('bt')));save();alert('Imported');render()}catch(e){alert('That text is not valid backup data.')}};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];let SP={k:'month',y:new Date().getFullYear(),m:new Date().getMonth(),a:'',b:''};
const rng=()=>{let{k,y,m}=SP,z=n=>String(n).padStart(2,'0');return k=='month'?[`${y}-${z(m+1)}-01`,`${y}-${z(m+1)}-31`]:k=='year'?[y+'-01-01',y+'-12-31']:k=='custom'?[SP.a||'0000',SP.b||'9999']:['0000','9999']};
const inr=d=>{let[a,b]=rng();return d>=a&&d<=b};
const spf=(k,x)=>{SP[k]=x;if(SP.m>11){SP.m=0;SP.y++}if(SP.m<0){SP.m=11;SP.y--}render()};
const V={
home:()=>{let ex=S.p.filter(p=>!p.done&&left(p)!==null&&left(p)<=30).length,tot=S.r.filter(r=>r.type=='AM'||r.type=='PM').reduce((a,r)=>a+r.steps.length,0),dn=S.l.filter(x=>x.d==td()&&S.r.some(r=>r.id==x.rid&&(r.type=='AM'||r.type=='PM'))).length;
return `<h1>Glow Shelf</h1><small>${new Date().toDateString()}</small><div class=g2 style="margin-top:10px"><div class=c><b>${S.p.filter(p=>!p.done).reduce((a,p)=>a+ +p.qty,0)}</b><small>Items on shelf</small></div><div class=c><b>${money(val())}</b><small>Shelf value</small></div><div class=c><b>${dn}/${tot}</b><small>Steps done today</small></div><div class="c ${ex?'wr':''}"><b>${ex}</b><small>Expiring in 30 days</small></div></div><h3>Today</h3>`+(S.r.filter(r=>r.type=='AM'||r.type=='PM').map(rc).join('')||'<p class=mu>Create a routine in the Routine tab.</p>')},
shelf:()=>`<div class=row><h1>My Shelf</h1><button class="b pr" onclick="pForm()">Add</button></div><input placeholder="Search products" value="${esc(q)}" oninput="q=this.value;$('#ls').innerHTML=lst()" style="margin-bottom:8px"><div>${['All',...CATS,'Used up'].map(c=>`<button class="ch ${f==c?'on':''}" onclick="f='${c}';render()">${c}</button>`).join('')}</div><div id=ls>${lst()}</div>`,
