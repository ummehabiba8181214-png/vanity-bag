<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Glow Shelf</title>
<style>
:root {
  --bg: #fbf5f7;
  --card: #ffffff;
  --tx: #3b2f3a;
  --mu: #85767f;
  --ac: #d9799b;
  --ac2: #f6dce6;
  --bd: #efe0e7;
  --wr: #e0a24a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--tx);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding-bottom: 80px;
}
main { max-width: 520px; margin: 0 auto; padding: 14px; }
h1 { font-size: 26px; margin: 4px 0 10px; font-weight: 700; }
h2 { font-size: 18px; margin: 16px 0 8px; font-weight: 600; }
h3 { margin: 16px 0 6px; font-size: 15px; }
small { font-size: 12px; color: var(--mu); }

.c {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 18px;
  padding: 14px;
  margin: 10px 0;
}
.c b { font-size: 22px; display: block; }

.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.g2 .c { margin: 0; }

.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

.btn {
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.btn.pr { background: var(--ac); color: #fff; border-color: var(--ac); }
.btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 20px; }

.pg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pc {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 18px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.ph {
  height: 100px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  font-size: 36px;
  background: var(--ac2);
}

.ck {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-top: 1px solid var(--bd);
  font-size: 14px;
}

.bar-bg {
  background: var(--ac2);
  border-radius: 10px;
  height: 10px;
  width: 100%;
  overflow: hidden;
  margin-top: 6px;
}
.bar-fill {
  background: var(--ac);
  height: 100%;
}

input, select {
  width: 100%;
  padding: 10px;
  margin: 6px 0 12px;
  border: 1px solid var(--bd);
  border-radius: 10px;
  font-size: 14px;
  background: var(--card);
  color: var(--tx);
}

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  background: var(--card);
  border-top: 1px solid var(--bd);
  z-index: 100;
  height: 60px;
}
nav button {
  flex: 1;
  border: 0;
  font-size: 12px;
  background: none;
  color: var(--mu);
  font-weight: 600;
  cursor: pointer;
}
nav button.on { color: var(--ac); }
</style>
</head>
<body>

<main id="v"></main>
<nav id="nv"></nav>

<script>
(function() {
  var K = 'glowshelf_final_v1';
  var E = { Skincare: '🧴', Makeup: '💄', Haircare: '💇', Fragrance: '🌸', Tools: '🪮' };
  var S = { p: [], r: [], cur: '$', tab: 'home' };

  function loadData() {
    try {
      var raw = localStorage.getItem(K);
      if (raw) S = Object.assign(S, JSON.parse(raw));
    } catch(e) {}

    if (!S.p || !S.p.length) {
      S.p = [
        { id: '1', cat: 'Skincare', brand: 'Glow Recipe', name: 'Dew Drops', price: 35, exp: '2025-12' },
        { id: '2', cat: 'Makeup', brand: 'Rare Beauty', name: 'Liquid Blush', price: 23, exp: '2025-08' },
        { id: '3', cat: 'Fragrance', brand: 'Replica', name: 'Jazz Club', price: 95, exp: '2026-05' },
        { id: '4', cat: 'Haircare', brand: 'Olaplex', name: 'No. 3 Treatment', price: 30, exp: '2025-11' }
      ];
    }
    if (!S.r || !S.r.length) {
      S.r = [
        { id: 'r1', name: 'Morning Glow Routine', steps: ['Cleanser', 'Vitamin C', 'Moisturizer', 'Sunscreen'] },
        { id: 'r2', name: 'Night Repair Routine', steps: ['Cleansing Oil', 'Retinol', 'Night Cream'] }
      ];
    }
  }

  function saveData() {
    try { localStorage.setItem(K, JSON.stringify(S)); } catch(e) {}
  }

  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function money(v) {
    return (S.cur || '$') + Number(v || 0).toFixed(2);
  }

  function calcTotal() {
    var t = 0;
    for (var i = 0; i < S.p.length; i++) t += Number(S.p[i].price || 0);
    return t;
  }

  window.switchTab = function(t) {
    S.tab = t;
    render();
  };

  window.addProduct = function() {
    var name = document.getElementById('inp-name').value;
    var brand = document.getElementById('inp-brand').value;
    var cat = document.getElementById('inp-cat').value;
    var price = document.getElementById('inp-price').value;
    var exp = document.getElementById('inp-exp').value;

    if (!name) { alert('Please enter product name!'); return; }

    S.p.unshift({
      id: String(Date.now()),
      name: name,
      brand: brand,
      cat: cat,
      price: Number(price) || 0,
      exp: exp
    });

    saveData();
    switchTab('shelf');
  };

  function render() {
    var v = document.getElementById('v');
    var nv = document.getElementById('nv');
    if (!v || !nv) return;

    var tab = S.tab || 'home';

    if (tab === 'home') {
      var html = '<h1>Glow Shelf</h1><small>' + new Date().toDateString() + '</small>';
      html += '<div class="g2" style="margin-top:12px">';
      html += '  <div class="c"><b>' + S.p.length + '</b><small>Shelf Products</small></div>';
      html += '  <div class="c"><b>' + money(calcTotal()) + '</b><small>Total Value</small></div>';
      html += '</div><h3>Daily Routines</h3>';

      for (var i = 0; i < S.r.length; i++) {
        var r = S.r[i];
        html += '<div class="c"><b style="font-size:16px;margin-bottom:8px">' + esc(r.name) + '</b>';
        for (var j = 0; j < r.steps.length; j++) {
          html += '<div class="ck"><span>' + esc(r.steps[j]) + '</span><span style="color:var(--mu)">✓</span></div>';
        }
        html += '</div>';
      }
      v.innerHTML = html;
    }
    else if (tab === 'shelf') {
      var html = '<div class="row"><h1>My Shelf</h1><button class="btn btn-sm pr" onclick="switchTab(\'add\')">+ Add Item</button></div>';
      html += '<div class="pg" style="margin-top:12px">';
      for (var k = 0; k < S.p.length; k++) {
        var item = S.p[k];
        html += '<div class="pc"><div class="ph">' + (E[item.cat] || '🧴') + '</div>';
        html += '<b style="font-size:15px">' + esc(item.name) + '</b>';
        html += '<small>' + esc(item.brand) + ' • ' + esc(item.cat) + '</small>';
        if (item.exp) html += '<small style="color:var(--wr)">Exp: ' + esc(item.exp) + '</small>';
        html += '<b style="font-size:14px;margin-top:auto">' + money(item.price) + '</b></div>';
      }
      html += '</div>';
      v.innerHTML = html;
    }
    else if (tab === 'stats') {
      var totalVal = calcTotal();
      var cats = {};
      for (var m = 0; m < S.p.length; m++) {
        var c = S.p[m].cat || 'Other';
        cats[c] = (cats[c] || 0) + (Number(S.p[m].price) || 0);
      }
      var html = '<h1>Statistics</h1><div class="c"><small>Total Shelf Value</small><b style="color:var(--ac);font-size:28px;">' + money(totalVal) + '</b></div>';
      html += '<h3>Category Breakdown</h3><div class="c">';
      for (var catKey in cats) {
        var catVal = cats[catKey];
        var pct = totalVal > 0 ? Math.round((catVal / totalVal) * 100) : 0;
        html += '<div style="margin-bottom:12px;"><div class="row"><span>' + (E[catKey] || '🧴') + ' ' + esc(catKey) + '</span><b>' + money(catVal) + ' (' + pct + '%)</b></div>';
        html += '<div class="bar-bg"><div class="bar-fill" style="width:' + pct + '%"></div></div></div>';
      }
      html += '</div>';
      v.innerHTML = html;
    }
    else if (tab === 'add') {
      var html = '<h1>Add Product</h1><div class="c">';
      html += '<label><small>Product Name</small></label><input type="text" id="inp-name" placeholder="e.g. Dew Drops">';
      html += '<label><small>Brand</small></label><input type="text" id="inp-brand" placeholder="e.g. Glow Recipe">';
      html += '<label><small>Category</small></label><select id="inp-cat">';
      html += '<option value="Skincare">Skincare 🧴</option><option value="Makeup">Makeup 💄</option><option value="Haircare">Haircare 💇</option><option value="Fragrance">Fragrance 🌸</option><option value="Tools">Tools 🪮</option></select>';
      html += '<label><small>Price</small></label><input type="number" id="inp-price" placeholder="0.00">';
      html += '<label><small>Expiration Date</small></label><input type="month" id="inp-exp">';
      html += '<button class="btn pr" style="width:100%;margin-top:10px" onclick="addProduct()">Save To Shelf</button></div>';
      v.innerHTML = html;
    }

    nv.innerHTML = '' +
      '<button class="' + (tab==='home'?'on':'') + '" onclick="switchTab(\'home\')">Home</button>' +
      '<button class="' + (tab==='shelf'?'on':'') + '" onclick="switchTab(\'shelf\')">My Shelf</button>' +
      '<button class="' + (tab==='stats'?'on':'') + '" onclick="switchTab(\'stats\')">Stats</button>' +
      '<button class="' + (tab==='add'?'on':'') + '" onclick="switchTab(\'add\')">+ Add</button>';
  }

  loadData();
  render();
})();
</script>
</body>
</html>
